[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-anywhere"
version = "0.2.1"
description = "Experimental local iOS builds for Expo and Godot on Linux"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
ios-anywhere = "ios_linux.cli:main"
ios-linux = "ios_linux.cli:main"

[tool.setuptools.packages.find]
include = ["ios_linux*"]

[tool.setuptools.package-data]
ios_linux = ["scripts/*", "scripts/bin/*", "templates/*"]

[tool.ruff]
line-length = 100
